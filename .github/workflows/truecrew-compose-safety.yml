name: True Crew compose safety

on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker-compose.vars.example
      - .github/workflows/truecrew-compose-safety.yml
  push:
    branches: [master]
    paths:
      - docker-compose.yml
      - docker-compose.vars.example
      - .github/workflows/truecrew-compose-safety.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose without starting services
        run: docker compose --env-file docker-compose.vars.example -f docker-compose.yml config --quiet
